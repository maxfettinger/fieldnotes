# Fieldnotes' example site. Run it from the theme's folder:
#   hugo server -s exampleSite        (with HUGO_MAPTILER_KEY set for the trip map)
baseURL = "https://fieldnotes.maxfettinger.com/"
locale = "en-US"
title = "Jane Doe"
disableKinds = ["taxonomy", "term"]   # no tag and category pages: Fieldnotes doesn't show tags (yet)
theme = "fieldnotes"
themesDir = "../.."          # the theme is this repository; a site of your own uses themes/ or a Hugo module

[pagination]
  pagerSize = 10

# Two Markdown settings the theme needs but can't set itself (a theme's config only sets params and menus):
# code colours as CSS classes, so light and dark mode can colour code differently, and maths passed through to
# MathJax untouched (otherwise Markdown eats the backslashes in \( \) and \[ \]).
[markup.highlight]
  noClasses = false
# An image alone in its paragraph becomes a figure, with its title as the caption (posts/writing-in-markdown)
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)']]

[menus]
  [[menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 10
  [[menus.main]]
    name = "Trips"
    pageRef = "/trips"
    weight = 20
  [[menus.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 30
  [[menus.main]]
    name = "Presets"
    pageRef = "/presets"
    weight = 33
  [[menus.main]]
    name = "Generator"
    pageRef = "/generator"
    weight = 35
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 40
  [[menus.main]]
    name = "Docs"
    url = "/docs/"           # the theme's documentation, published next to this demo
    weight = 50

[params]
  description = "Jane Doe writes about long bike trips and numerical analysis."
  mainSections = ["posts", "trips"]   # what the home page lists
  math = false                         # MathJax everywhere; here only on the page that asks for it

  # Profile icons on the home page: name picks a Feather icon (github, linkedin, instagram, mail/email, rss, ...).
  # Keep it above the [params.*] tables: in TOML a key after a table header belongs to that table.
  socialIcons = [
    { name = "github", url = "https://github.com/" },
    { name = "linkedin", url = "https://www.linkedin.com/" },
    { name = "instagram", url = "https://www.instagram.com/" },
    { name = "email", url = "mailto:jane@example.org" },
  ]

  # Search engines: who the site is about (JSON-LD). sameAs are the socialIcons above.
  [params.author]
    name = "Jane Doe"
    alternateName = "J. Doe"
    jobTitle = "PhD student"
    image = "images/stickman.svg"
    [params.author.affiliation]
      name = "University of Example"
      url = "https://example.org/university"

  # The look: a preset is how the site is drawn, a scheme its colours, light and dark (empty: the preset's own).
  # See the theme's hugo.toml for all names, and the playground on this site's home page.
  [params.style]
    preset = "fieldnotes"
    scheme = ""

  [params.mode]
    default = "auto"   # light, dark or auto
    toggle = true

  [params.fonts]
    body = ""          # any Google Fonts family; heading and mono are optional
    heading = ""
    mono = ""

  [params.background]
    light = ""         # grid, dots, none or an image in assets/
    dark = ""

  # Colours per mode: bg, surface, text, primary, secondary, tertiary, accent, border, pattern
  [params.colors.light]
  [params.colors.dark]

  [params.favicon]
    svg = "favicon.svg"

  [params.map]
    style = "topo-v4"
    styleDark = "topo-v4"      # the light map in dark mode too
