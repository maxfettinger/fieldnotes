# Builds the demo (exampleSite/, at the site's root) and the documentation (docs/, under /docs/, made with the
# Vitrine theme as a Hugo module) and publishes both on GitHub Pages on every push to main. The trip map's key comes
# from the repository secret MAPTILER_KEY; without it the map shows a note instead.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.167.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install Hugo
        run: |
          curl -sSL -o "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build the demo
        run: hugo --minify --source exampleSite --baseURL "${{ steps.pages.outputs.base_url }}/" --destination "$GITHUB_WORKSPACE/public"
        env:
          HUGO_MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
      - name: Build the docs
        run: hugo --minify --source docs --baseURL "${{ steps.pages.outputs.base_url }}/docs/" --destination "$GITHUB_WORKSPACE/public/docs"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
